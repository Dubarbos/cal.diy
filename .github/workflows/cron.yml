name: Cron - extra routes (calendar sync, tasker)

# Companion to the official cron-*.yml workflows in this directory, which
# already cover bookingReminder, changeTimeZone, syncAppMeta and
# webhookTriggers. This file covers the remaining app/api/cron/* and
# app/api/tasks/* routes that don't have an official workflow yet.
#
# Vercel's own Cron Jobs feature isn't used here because the Hobby plan
# only allows once-a-day schedules; these run from GitHub Actions instead,
# same as the official cron-*.yml files.

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  frequent:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_API_KEY: ${{ secrets.CRON_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    runs-on: ubuntu-latest
    steps:
      - name: calendar-subscriptions
        if: ${{ env.APP_URL && env.CRON_API_KEY }}
        run: curl "${{ env.APP_URL }}/api/cron/calendar-subscriptions" -X GET -H "authorization: ${{ env.CRON_API_KEY }}" -sSf
      - name: selected-calendars
        if: ${{ env.APP_URL && env.CRON_API_KEY }}
        run: curl "${{ env.APP_URL }}/api/cron/selected-calendars" -X GET -H "authorization: ${{ env.CRON_API_KEY }}" -sSf
      - name: tasks/cron
        if: ${{ env.APP_URL && env.CRON_SECRET }}
        run: curl "${{ env.APP_URL }}/api/tasks/cron" -X GET -H "authorization: Bearer ${{ env.CRON_SECRET }}" -sSf

  daily:
    if: github.event.schedule == '0 3 * * *'
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_API_KEY: ${{ secrets.CRON_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    runs-on: ubuntu-latest
    steps:
      - name: calendar-subscriptions-cleanup
        if: ${{ env.APP_URL && env.CRON_API_KEY }}
        run: curl "${{ env.APP_URL }}/api/cron/calendar-subscriptions-cleanup" -X GET -H "authorization: ${{ env.CRON_API_KEY }}" -sSf
      - name: tasks/cleanup
        if: ${{ env.APP_URL && env.CRON_SECRET }}
        run: curl "${{ env.APP_URL }}/api/tasks/cleanup" -X GET -H "authorization: Bearer ${{ env.CRON_SECRET }}" -sSf
